name: ICooked Windows build

on:
  push:
    branches: [main, claude/pcba-manufacturing-game-rpkwpp]
    paths: ['icooked/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: icooked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: icooked/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package portable exe
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ICooked-windows-portable
          path: icooked/release/ICooked-portable.exe
      - name: Publish to the "icooked-windows-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icooked-windows-latest
          name: ICooked Windows (latest test build)
          body: Portable Windows build. Download ICooked-portable.exe and run it (no install). Windows SmartScreen will warn because it is unsigned — click "More info" then "Run anyway".
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: icooked/release/ICooked-portable.exe
