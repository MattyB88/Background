<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCBA AOI</title>
<style>
:root{--bg:#0f1318;--panel:#161b22;--panel2:#1f262f;--panel3:#27303b;--line:#2c3542;--txt:#e6ebf1;--dim:#8a96a6;
--ok:#22c55e;--ok-d:#0f3d22;--bad:#ef4444;--bad-d:#4a1616;--warn:#f59e0b;--acc:#3b82f6;--acc-d:#16294a;--sel:#a855f7;
--r:8px;--sh:0 1px 2px #0006}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;font-weight:500;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:7px 12px;transition:background .12s,border-color .12s,transform .05s}
button:hover{background:var(--panel3);border-color:#3a4656}button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:14px;font-weight:600;padding:10px 14px;width:100%;margin:5px 0;display:flex;align-items:center;gap:10px;justify-content:center;box-shadow:var(--sh)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:#2f6fe0}
button.ok{background:var(--ok);border-color:var(--ok);color:#052e14}button.ok:hover{background:#1eb053}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}button.bad:hover{background:#dc3434}
button.on{border-color:var(--acc);background:var(--acc-d);color:#cfe0ff}
.ico{font-size:16px;line-height:1}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
header h1{font-size:15px;font-weight:700;letter-spacing:.3px;margin:0 8px 0 2px;white-space:nowrap}
header>button{padding:6px 9px;font-size:15px;background:transparent;border-color:transparent}header>button:hover{background:var(--panel2);border-color:var(--line)}
select,input{font:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px}
select:focus,input:focus{outline:none;border-color:var(--acc)}
header select{min-width:170px;font-weight:600}
.steps{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center}
.step{display:flex;align-items:center;gap:6px;padding:5px 10px;background:transparent;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:500;color:var(--dim);white-space:nowrap}
.step:hover{background:var(--panel2);color:var(--txt)}
.step .n{background:var(--panel3);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--dim)}
.step.done{color:var(--txt)}.step.done .n{background:var(--ok);color:#052e14}
.step.cur{background:var(--acc-d);border-color:#2a4f8a;color:#fff}.step.cur .n{background:var(--acc);color:#fff}
.arrow{color:#3a4656;font-size:11px}
main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;background:#0a0d11;min-width:0}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#side{width:360px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;overflow-y:auto}
#side h2{margin:2px 0 10px;font-size:16px;font-weight:650;letter-spacing:.2px}
#side h3{margin:14px 0 6px;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.hint{background:var(--acc-d);border:1px solid #24406e;padding:9px 11px;border-radius:var(--r);font-size:13px;margin:8px 0;color:#cdddf7}
.hint.big{font-size:14px;font-weight:600}
.banner{font-size:26px;font-weight:800;letter-spacing:1px;text-align:center;border-radius:var(--r);padding:10px;margin:8px 0}
.banner.pass{background:var(--ok-d);color:#4ade80;border:1px solid #1e7a43}.banner.fail{background:var(--bad-d);color:#fca5a5;border:1px solid #8a2a2a}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left}
.tile b{display:block;font-size:18px;font-weight:650}.tile span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row>*{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,40px);gap:4px;justify-content:center;margin:8px 0}
.pad button{height:40px;font-size:15px;padding:0}
.card{background:var(--panel2);border-radius:var(--r);padding:10px;margin:8px 0;border:1px solid var(--line)}
.card.cur{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.card .imgs{display:flex;gap:6px;align-items:center}.card .imgs>div{flex:1;min-width:0;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}.card .imgs img{width:100%}
.card img{flex:1;min-width:0;border-radius:6px;background:#000;max-height:200px;object-fit:contain;margin-top:3px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.4px;background:var(--bad);color:#fff;margin:2px;vertical-align:middle}
.tag.w{background:var(--warn);color:#1f1300}
.bar{height:20px;background:#7f2a2a;border-radius:4px;margin:3px 0;display:flex;align-items:center;padding:0 8px;font-size:12px;white-space:nowrap}
.chk{display:flex;gap:5px;flex-wrap:wrap}.chk button{flex:1 1 45%;font-size:13px}
label.sl{display:block;margin:10px 0 2px;color:var(--dim);font-size:12px}input[type=range]{width:100%;accent-color:var(--acc)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b0f14ee;border:1px solid var(--line);padding:9px 16px;border-radius:var(--r);font-size:13px;display:none;z-index:9;box-shadow:0 6px 24px #0008}
.legend{position:absolute;left:10px;bottom:10px;background:#0b0f14cc;border:1px solid var(--line);padding:4px 10px;border-radius:6px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 8px;vertical-align:middle}
details summary{font-size:13px !important;color:var(--dim)}
table td{padding:4px 5px}
a.big{font-size:14px !important;padding:10px 14px !important;border:1px solid var(--line);font-weight:600 !important}
@media (max-width:800px){main{flex-direction:column}#side{width:auto;max-width:none;height:50vh}}
</style>
</head>
<body>
<header>
  <h1>◉ PCBA&nbsp;AOI</h1>
  <select id="prog" title="Program"></select>
  <nav class="steps" id="steps"></nav>
  <button id="bList" title="Parts list">📋</button>
  <button id="bLib" title="Parts library">📚</button>
  <button id="bStats" title="Statistics">📊</button>
  <button id="bSet" title="Advanced settings">⚙</button>
</header>
<main>
  <div id="view"><canvas id="cv"></canvas>
    <div class="legend"><i style="background:var(--ok)"></i>Pass<i style="background:var(--bad)"></i>Fail<i style="background:var(--acc)"></i>ROI<i style="background:var(--warn)"></i>Fiducial<i style="background:#666"></i>Off</div>
  </div>
  <aside id="side"></aside>
</main>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>
<script>
const $=s=>document.querySelector(s);
const STEPS=[["program","📄","Program"],["board","🖼","Board"],["align","🎯","Align"],["rois","🔲","ROIs"],["inspect","▶","Inspect"],["review","✔","Review"]];
let S={prog:null,data:null,step:"program",img:null,imgSrc:null,view:{s:1,x:0,y:0},sel:null,teach:[],result:null,revIdx:0,watch:null};

async function api(path,opt={}){
  if(opt.json){opt.body=JSON.stringify(opt.json);opt.headers={"Content-Type":"application/json"};opt.method=opt.method||"POST";}
  const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok){toast("⚠ "+(j.error||r.status));throw new Error(j.error);}return j;
}
function toast(t,ms=2500){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",ms);}
function pickFile(accept){return new Promise(res=>{const f=$("#fileIn");f.accept=accept;f.value="";f.onchange=()=>res(f.files[0]);f.click();});}
const P=()=>"/api/programs/"+encodeURIComponent(S.prog);

/* ---------- programs ---------- */
async function loadPrograms(sel){
  const list=await api("/api/programs");const s=$("#prog");
  s.innerHTML='<option value="">— choose program —</option>'+list.map(n=>`<option>${n}</option>`).join("")+'<option value="__new">＋ New program…</option>';
  if(sel){s.value=sel;await openProgram(sel);}
}
$("#prog").onchange=async e=>{
  if(e.target.value==="__new"){const n=prompt("Program name (e.g. PCBA-1234 revB)");if(n){await api("/api/programs",{json:{name:n}});await loadPrograms(n.replace(/[^A-Za-z0-9_.-]+/g,"_"));go("program");}else e.target.value=S.prog||"";return;}
  await openProgram(e.target.value);
};
async function openProgram(n){
  S.prog=n||null;S.result=null;S.sel=null;
  if(!n){S.data=null;renderSteps();side();draw();return;}
  await refresh();
  const d=S.data;go(!d.components.length?"program":!d.has_golden?"board":!d.transform?"align":"inspect");
}
async function refresh(){S.data=await api(P());if(S.data.has_golden&&!S.result)await setImg(P()+"/golden.jpg?"+Date.now());renderSteps();}

/* ---------- step bar ---------- */
function stepDone(k){const d=S.data;if(!d)return false;
  return {program:d.components.length>0,board:d.has_golden,align:!!d.transform,rois:!!d.transform,inspect:!!S.result,review:false}[k];}
function renderSteps(){
  $("#steps").innerHTML=STEPS.map(([k,i,t],n)=>(n?'<span class="arrow">➜</span>':"")+`<button class="step ${stepDone(k)?"done":""} ${S.step==k?"cur":""}" data-k="${k}"><span class="n">${stepDone(k)?"✓":n+1}</span>${i} ${t}</button>`).join("");
  document.querySelectorAll(".step").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(k){S.step=k;if(k!=="align")S.teach=[];renderSteps();side();draw();}
$("#bStats").onclick=()=>go("stats");$("#bLib").onclick=()=>{S.libPkg=null;go("library");};$("#bList").onclick=()=>go("list");$("#bSet").onclick=()=>go("settings");

/* ---------- side panels ---------- */
function side(){
  const el=$("#side"),d=S.data;
  if(!S.prog&&S.step!=="settings"){el.innerHTML=`<h2>Start</h2>
    <div class="hint big">⬆ Pick a program at the top — or make a new one</div>
    <button class="big pri" id="bNew"><span class="ico">＋</span>New program</button>
    <button class="big" id="bDemo"><span class="ico">🧪</span>Try the demo board</button>`;
    $("#bNew").onclick=()=>{$("#prog").value="__new";$("#prog").onchange({target:$("#prog")});};
    $("#bDemo").onclick=demo;return;}
  (PANELS[S.step]||(()=>{}))(el,d);
}
async function demo(){toast("Building demo…");await api("/api/demo",{method:"POST"});await loadPrograms("DEMO_BOARD");}

const PANELS={
program(el,d){
  el.innerHTML=`<h2>📄 Placement data</h2>
   <div class="hint">Load the PnP / MYData export (CSV, TXT, .pos). Packages are made automatically.</div>
   <button class="big pri" id="bImp"><span class="ico">📂</span>Import file</button>
   <button class="big" id="bWiz"><span class="ico">🧩</span>Odd file? Map columns (wizard)</button>
   <button class="big" id="bBom"><span class="ico">📦</span>Load BOM (IPN + designators, no XY)</button>
   <button class="big" id="bPhoto"><span class="ico">📷</span>No placement file? Build from photo</button>
   <div class="row"><span>Units</span><select id="units"><option value="auto">Auto</option><option>mm</option><option value="um">µm (MYData)</option><option>mil</option></select></div>
   ${d.components.length?`<div class="tiles"><div class="tile"><b>${d.components.length}</b><span>placements</span></div>
   <div class="tile"><b>${Object.keys(d.packages).length}</b><span>packages</span></div>
   <div class="tile"><b>${d.components.filter(c=>c.fiducial).length}</b><span>fiducials</span></div>
   <div class="tile"><b>${d.components.filter(c=>c.enabled).length}</b><span>to inspect</span></div></div>
   <button class="big ok" id="bNext">Next ➜ Board image</button>`:""}`;
  $("#bImp").onclick=async()=>{const f=await pickFile(".csv,.txt,.pos,.tsv,.xy,*");if(!f)return;
    const fd=new FormData();fd.append("file",f);fd.append("units",$("#units").value);
    const r=await api(P()+"/import",{method:"POST",body:fd});
    toast(`✔ ${r.count} parts, ${r.packages} packages`+(r.warnings.length?" — "+r.warnings.join("; "):""),5000);await refresh();side();};
  $("#bBom").onclick=async()=>{const f=await pickFile(".csv,.txt,*");if(!f)return;const fd=new FormData();fd.append("file",f);
    const r=await api(P()+"/bom",{method:"POST",body:fd});await refresh();
    toast(`📦 BOM: ${r.refs} refs, ${r.smd} SMD to inspect, ${r.placed} already boxed`+(r.warnings.length?" · ⚠ "+r.warnings.join("; "):""),7000);go("list");};
  $("#bWiz").onclick=async()=>{const f=await pickFile(".csv,.txt,.pos,.tsv,.xy,*");if(!f)return;S.wiz={file:f,fmt:{}};go("wizard");};
  $("#bPhoto").onclick=async()=>{const f=await pickFile("image/*");if(!f)return;const bm=prompt("Board length in mm (optional - makes tolerances real mm)","");const fd=new FormData();fd.append("image",f);toast("Finding parts…");
    const r=await api(P()+"/from_photo"+(bm?`?board_mm=${encodeURIComponent(bm)}`:""),{method:"POST",body:fd});toast(`✔ ${r.parts} parts, ${r.holes} holes · ${r.ppm} px/mm — now train with good boards`,6000);
    await refresh();go("inspect");};
  if($("#bNext"))$("#bNext").onclick=()=>go("board");
},
board(el,d){
  el.innerHTML=`<h2>🖼 Golden board</h2>
   <div class="hint">Use a <b>known-good</b> board. Same camera + lights as production.</div>
   <button class="big pri" id="bUp"><span class="ico">🖼</span>Upload image</button>
   <button class="big" id="bCam"><span class="ico">📷</span>Camera snapshot</button>
   ${d.has_golden&&d.transform?`<div class="hint" style="margin-top:14px">Optional: photo of a <b>BARE board</b> (no parts), same camera position → boxes snap onto the real parts + stronger missing-part check.</div>
   <button class="big ${d.has_bare?"ok":""}" id="bBare"><span class="ico">⬜</span>${d.has_bare?"✔ Bare board added — replace":"Add BARE board"}</button><div id="bareOut"></div>`:""}
   ${d.has_golden?`<button class="big ok" id="bNext">Next ➜ Align</button>`:""}`;
  const done=async r=>{toast(r.auto_aligned?"✔ Fiducials found automatically":"Image saved — now click the fiducials",4000);await refresh();go("align");};
  $("#bUp").onclick=async()=>{const f=await pickFile("image/*");if(!f)return;const fd=new FormData();fd.append("image",f);done(await api(P()+"/golden",{method:"POST",body:fd}));};
  $("#bCam").onclick=async()=>done(await api(P()+"/golden?camera=1",{method:"POST"}));
  if($("#bBare"))$("#bBare").onclick=async()=>{const f=await pickFile("image/*");if(!f)return;const fd=new FormData();fd.append("image",f);toast("Comparing bare vs golden…");
    const r=await api(P()+"/bare",{method:"POST",body:fd});await refresh();side();draw();
    $("#bareOut").innerHTML=`<div class="tiles"><div class="tile"><b>${r.parts_found}</b><span>parts seen</span></div><div class="tile"><b style="color:var(--ok)">${r.snapped||r.created}</b><span>${r.created?"parts created":"boxes snapped"}</span></div></div>`+
      (r.not_found.length?`<div style="color:var(--warn)">Check by hand: ${r.not_found.map(esc).join(", ")}</div>`:"");};
  if($("#bNext"))$("#bNext").onclick=()=>go("align");
},
align(el,d){
  const fids=d.components.filter(c=>c.fiducial);
  const cand=(fids.length>=2?fids:d.components).map(c=>c.ref);
  const want=S.teach.length<2?cand.filter(r=>!S.teach.find(t=>t.ref==r))[0]:null;
  S.teachRef=S.teachRef&&!S.teach.find(t=>t.ref==S.teachRef)?S.teachRef:want;
  el.innerHTML=`<h2>🎯 Align</h2>
   ${d.transform?`<div class="hint" style="border-color:var(--ok)">✔ Aligned. Blue boxes should sit on the parts.</div>`:""}
   <button class="big pri" id="bAuto"><span class="ico">✨</span>Auto-find fiducials</button>
   ${d.transform&&!S.teach.length?`<div style="color:var(--dim);margin:8px 0">Boxes off? Click <b style="color:var(--warn)">${S.teachRef||"—"}</b> on the image to re-teach</div>`:`<div class="hint big">👆 Click the centre of <span style="color:var(--warn)">${S.teachRef||"—"}</span> on the image</div>`}
   <div class="row"><span>Reference</span><select id="tref">${cand.map(r=>`<option ${r==S.teachRef?"selected":""}>${r}</option>`).join("")}</select></div>
   <div>${S.teach.map(t=>`<span class="tag" style="background:var(--warn);color:#000">✓ ${t.ref}</span>`).join("")}</div>
   <div class="row"><button id="bFlip">↕ Flip Y (${d.y_up?"Y up":"Y down"})</button><button id="bClr">↺ Restart</button></div>
   ${d.transform?`<button class="big ok" id="bNext">Next ➜ Check ROIs</button>`:""}`;
  $("#tref").onchange=e=>{S.teachRef=e.target.value;side();};
  $("#bAuto").onclick=async()=>{await api(P()+"/teach",{json:{auto:true}});toast("✔ Aligned");await refresh();side();draw();};
  $("#bFlip").onclick=async()=>{await api(P()+"/settings",{method:"PUT",json:{y_up:!d.y_up}});S.teach=[];await refresh();side();draw();};
  $("#bClr").onclick=()=>{S.teach=[];side();draw();};
  if($("#bNext"))$("#bNext").onclick=()=>go("rois");
},
rois(el,d){
  const c=S.sel&&d.components.find(c=>c.ref==S.sel);
  if(!c){el.innerHTML=`<h2>🔲 ROIs</h2><div class="hint big">👆 Click a part on the image to adjust it</div>
    <button class="big ${S.teachMode?"ok":""}" id="bTeachMode"><span class="ico">➕</span>${S.teachMode?"Teaching: click parts to add":"Teach parts (click to add)"}</button>
    ${S.teachMode&&d.bom?`<div class="hint big">👆 Click <span style="color:var(--warn)">${esc(S.teachRef2||d.next_ref||"—")}</span> ${d.bom[S.teachRef2||d.next_ref]?`<small style="font-size:14px">${esc(d.bom[S.teachRef2||d.next_ref].ipn)}</small>`:""}</div>
      <div class="row"><span>or pick</span><select id="tRef"><option value="">next in BOM</option>${Object.keys(d.bom).filter(r=>!d.bom[r].th&&!d.components.some(c=>c.ref==r)).map(r=>`<option ${r==S.teachRef2?"selected":""}>${esc(r)}</option>`).join("")}</select></div>`:""}
    <div class="tiles"><div class="tile"><b>${d.components.filter(c=>c.enabled).length}</b><span>inspected</span></div><div class="tile"><b>${Object.keys(d.packages).length}</b><span>packages</span></div></div>
    <button class="big pri" id="bFitAll"><span class="ico">✨</span>Auto-fit ALL package sizes</button>
    <div id="fitOut"></div>
    <button class="big ok" id="bNext">Next ➜ Inspect</button>`;$("#bNext").onclick=()=>go("inspect");
    $("#bTeachMode").onclick=()=>{S.teachMode=!S.teachMode;side();};
    if($("#tRef"))$("#tRef").onchange=e=>{S.teachRef2=e.target.value||null;side();};
    $("#bFitAll").onclick=async()=>{$("#fitOut").innerHTML='<div class="hint">Measuring…</div>';
      const r=await api(P()+"/autofit_all",{method:"POST"});await refresh();draw();
      $("#fitOut").innerHTML=`<div class="tiles"><div class="tile"><b style="color:var(--ok)">${r.fitted.length}</b><span>fitted ✔</span></div><div class="tile"><b style="color:var(--warn)">${r.failed.length}</b><span>check by hand</span></div></div>`+
        (r.failed.length?`<div style="color:var(--dim);font-size:13px">Tap a part to set by hand: ${r.failed.map(esc).join(", ")}</div>`:"");};
    return;}
  const pk=d.packages[c.package];const ch={presence:true,polarity:pk.polarized,ocv:pk.marking,offset:true,bridge:pk.pads.length>=4,...(c.checks||{})};
  el.innerHTML=`<h2>${c.ref} <small style="color:var(--dim);font-size:15px">${c.ipn?esc(c.ipn)+" · ":""}${c.part}</small></h2>
   <div class="row"><span>Package</span><select id="pk">${Object.keys(d.packages).map(p=>`<option ${p==c.package?"selected":""}>${p}</option>`).join("")}</select></div>
   <div style="text-align:center;color:var(--dim)">Move ROI (0.05 mm)</div>
   <div class="pad"><span></span><button data-m="0,1">▲</button><span></span><button data-m="-1,0">◀</button><button id="bRot" title="Rotate 90°">⟳</button><button data-m="1,0">▶</button><span></span><button data-m="0,-1">▼</button><span></span></div>
   <div style="text-align:center;color:var(--dim)">Body size — all <b>${c.package}</b> (${pk.body_l.toFixed(2)} × ${pk.body_w.toFixed(2)} mm)</div>
   <button class="big pri" id="bFit"><span class="ico">✨</span>Auto-fit size from image</button>
   <div class="row"><button data-b="body_l,-1">L −</button><button data-b="body_l,1">L ＋</button><button data-b="body_w,-1">W −</button><button data-b="body_w,1">W ＋</button></div>
   <div style="color:var(--dim);margin-top:10px">Checks</div>

  el.innerHTML=`<button id="bBack">◀ All packages</button><h2>${esc(k)}</h2>
    <div style="color:var(--dim)">${parts.length} parts: ${parts.slice(0,12).map(c=>c.ref).join(", ")}${parts.length>12?"…":""}</div>
    <div style="color:var(--dim);margin-top:10px">Checks for all ${esc(k)}</div>
    <div class="chk">${CHECKS.map(([c,t])=>`<button data-c="${c}" class="${ch[c]?"on":""}">${ch[c]?"✔":"✖"} ${t}</button>`).join("")}</div>
    <h3>🎚 Package tuning</h3>${tuneBox(d.thresholds,own,"p")}
    <div class="row"><button class="big" id="bFitP">✨ Auto-fit size</button><button class="big pri" id="bSaveLib">💾 Save to library</button></div>`;
  $("#bBack").onclick=()=>{S.libPkg=null;side();};
  wireTune(el,own,async o=>{await api(P()+"/tune/package/"+encodeURIComponent(k),{method:"PUT",json:{th:o}});await refresh();side();},"p");
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{await api(P()+"/tune/package/"+encodeURIComponent(k),{method:"PUT",json:{checks:{...ch,[b.dataset.c]:!ch[b.dataset.c]}}});await refresh();side();});
  $("#bFitP").onclick=async()=>{const r=await api(P()+"/autofit/"+encodeURIComponent(k),{method:"POST"});toast(`✨ ${r.body_l} × ${r.body_w} mm`);await refresh();side();draw();};
  $("#bSaveLib").onclick=async()=>{const r=await api(P()+"/library/save/"+encodeURIComponent(k),{method:"POST"});toast(`💾 Saved — library has ${r.count} packages`);side();};
},
async stats(el,d){
  el.innerHTML="<h2>📊 Stats</h2>…";const s=await api(P()+"/stats");const mx=Math.max(1,...s.top_refs.map(x=>x[1]));
  const bars=(arr)=>arr.length?arr.map(([k,v])=>`<div class="bar" style="width:${20+80*v/Math.max(1,...arr.map(x=>x[1]))}%">${k||"?"} · ${v}</div>`).join(""):'<div style="color:var(--dim)">none yet</div>';
  el.innerHTML=`<h2>📊 Stats</h2>
   <div class="tiles"><div class="tile"><b>${s.boards}</b><span>boards</span></div><div class="tile"><b>${s.fpy??"–"}%</b><span>first pass yield</span></div>
   <div class="tile"><b>${s.false_call_rate??"–"}%</b><span>false call rate</span></div><div class="tile"><b>${s.avg_cycle_s??"–"}s</b><span>avg cycle</span></div></div>
   <div style="display:flex;gap:3px;margin:12px 0;height:30px">${s.recent.map(x=>`<div title="${x.run}" style="flex:1;border-radius:3px;background:${x.ok?"var(--ok)":"var(--bad)"}"></div>`).join("")}</div>
   <a class="big" href="${P()}/export.csv" download style="display:flex;justify-content:center;gap:12px;text-decoration:none;color:var(--txt);background:var(--panel2);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;margin:5px 0">⬇ Export results (Excel CSV)</a><h3>False call causes</h3>${bars(s.false_call_reasons||[])}<h3>Defect type</h3>${bars(s.by_type)}<h3>Worst parts</h3>${bars(s.top_refs)}<h3>By package</h3>${bars(s.by_package)}
   ${d.ai?`<button class="big pri" id="bSum">🤖 AI summary & next actions</button><div id="aiOut"></div>`:`<div style="color:var(--dim)">🤖 Add an AI key in ⚙ for automatic summaries</div>`}`;
  if($("#bSum"))$("#bSum").onclick=async()=>{$("#aiOut").innerHTML='<div class="hint">Thinking…</div>';const a=await api(P()+"/ai/summary",{method:"POST"});$("#aiOut").innerHTML=`<div class="hint" style="white-space:pre-wrap">${esc(a.text)}</div>`;};
},
async settings(el,d){
  const a=await api("/api/settings");const t=d?d.thresholds:null;
  const sl=(k,lbl,min,max,step)=>`<label class="sl">${lbl}: <b id="v_${k}">${t[k]}</b></label><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${t[k]}">`;
  el.innerHTML=`<h2>⚙ Settings</h2>${t?`<h3>Sensitivity</h3>
   ${sl("presence","Missing part (higher = stricter)",.3,.9,.01)}${sl("polarity_margin","Polarity margin (lower = stricter)",0,.3,.01)}
   ${sl("ocv","Marking match",.1,.9,.01)}${sl("offset_mm","Max offset mm",.05,1,.05)}${sl("bridge","Solder bridge (lower = stricter)",.4,3,.1)}
   <button class="big ${d.compare&&d.compare.enabled?"ok":""}" id="bCmp">${d.compare&&d.compare.enabled?"✔":"✖"} Foreign object (FOD) check</button>
   ${d.compare&&d.compare.enabled?`<label class="sl">FOD sensitivity (higher = finds smaller/fainter, more false calls): <b id="v_fod">${d.compare.sensitivity??0.5}</b></label><input type="range" id="fod" min="0" max="1" step="0.05" value="${d.compare.sensitivity??0.5}">`:""}${sl("search_mm","Search range mm",.2,2,.1)}`:""}
   <h3>📷 Camera</h3>
   <div class="row"><select id="camSel"><option>searching…</option></select><button id="bCamTest">👁 Test shot</button></div>
   <label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="camLock" ${(a.camera||{}).lock_exposure?"checked":""}> Lock exposure (stops brightness drifting)</label>
   <div id="camPrev"></div>
   <h3>💾 Programs</h3>
   ${d?`<a class="big" href="${P()}/backup.zip" download style="display:flex;justify-content:center;gap:12px;text-decoration:none;color:var(--txt);background:var(--panel2);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;margin:5px 0">💾 Backup this program (zip)</a>`:""}
   <button class="big" id="bRestore">📂 Restore program from zip</button>
   <h3>🤖 Advanced — AI assistant (optional)</h3>
   <div class="hint" style="font-size:14px">AOI works fully without this. When on, stats (no images, no customer data) are sent to the Claude API for summaries; single defect crops only when you press “second opinion”.</div>
   <button class="big ${a.enabled?"ok":""}" id="bAiOn">${a.enabled?"✔ AI on":"✖ AI off"}</button>
   <input id="key" type="password" placeholder="${a.has_key?"key saved ••••":"API key"}" style="width:100%;margin:6px 0">
   <input id="model" value="${a.model}" style="width:100%;margin:6px 0"><button class="big" id="bSave">💾 Save AI settings</button>`;
  el.querySelectorAll("input[type=range]").forEach(r=>r.onchange=async()=>{$("#v_"+r.dataset.k).textContent=r.value;await api(P()+"/settings",{method:"PUT",json:{thresholds:{[r.dataset.k]:r.value}}});await refresh();toast("✔ Saved");});
  if($("#fod"))$("#fod").onchange=async e=>{$("#v_fod").textContent=e.target.value;await api(P()+"/settings",{method:"PUT",json:{compare:{sensitivity:+e.target.value}}});toast("✔ Saved");};
  if($("#bCmp"))$("#bCmp").onclick=async()=>{await api(P()+"/settings",{method:"PUT",json:{compare:{enabled:!(d.compare&&d.compare.enabled)}}});await refresh();side();};
  api("/api/cameras").then(cs=>{$("#camSel").innerHTML=cs.length?cs.map(c=>`<option value="${c.index}" ${c.index==((a.camera||{}).index||0)?"selected":""}>Camera ${c.index} — ${c.width}×${c.height}</option>`).join(""):"<option>No camera found</option>";}).catch(()=>{});
  const camSave=async()=>{await api("/api/settings",{json:{camera:{...(a.camera||{}),index:+$("#camSel").value||0,lock_exposure:$("#camLock").checked}}});toast("✔ Camera saved");};
  $("#camSel").onchange=camSave;$("#camLock").onchange=camSave;
  $("#bCamTest").onclick=()=>{$("#camPrev").innerHTML=`<img src="/api/camera/preview.jpg?cam=${$("#camSel").value}&t=${Date.now()}" style="width:100%;border-radius:8px" onerror="this.replaceWith('⚠ no picture')">`;};
  $("#bRestore").onclick=async()=>{const f=await pickFile(".zip");if(!f)return;const fd=new FormData();fd.append("file",f);const r=await api("/api/restore",{method:"POST",body:fd});toast("✔ Restored "+r.name);await loadPrograms(r.name);};
  $("#bAiOn").onclick=async()=>{await api("/api/settings",{json:{enabled:!a.enabled}});if(S.prog)await refresh();side();};
  $("#bSave").onclick=async()=>{const b={model:$("#model").value};if($("#key").value)b.api_key=$("#key").value;await api("/api/settings",{json:b});toast("✔ Saved");side();};
}};
const TUNE=[["presence","Missing part (higher = stricter)",.2,.95,.01],["min_on_pad","On pad min (taught parts)",.2,.95,.05],
  ["offset_mm","Max offset mm",.05,1.5,.05],["polarity_margin","Polarity margin (lower = stricter)",0,.4,.01],
  ["ocv","Marking match",.05,.9,.01],["bridge","Solder bridge (lower = stricter)",.3,3,.1],["search_mm","Search range mm",.1,2,.1]];
const CHECKS=[["presence","⬛ Missing"],["polarity","➕ Polarity"],["ocv","🔤 Marking"],["offset","↔ Offset"],["bridge","🔗 Bridge"]];
function tuneBox(base,own,idp){ // base = inherited values, own = this level's overrides
  return TUNE.map(([k,t,a,b,st])=>{const v=own[k]??base[k]??0.5;const set=own[k]!=null;
    return `<label class="sl">${t}: <b id="${idp}v_${k}">${(+v).toFixed(2)}</b> ${set?`<a data-reset="${k}" style="color:var(--warn);cursor:pointer">↺ inherited</a>`:`<span style="color:var(--dim)">(inherited)</span>`}</label>
    <input type="range" data-tk="${k}" min="${a}" max="${b}" step="${st}" value="${v}">`}).join("");}
function wireTune(el,own,save,idp){
  el.querySelectorAll("[data-tk]").forEach(r=>{r.oninput=()=>{$("#"+idp+"v_"+r.dataset.tk).textContent=(+r.value).toFixed(2)};
    r.onchange=async()=>{own[r.dataset.tk]=+r.value;await save(own);toast("✔ Saved");}});
  el.querySelectorAll("[data-reset]").forEach(a=>a.onclick=async()=>{delete own[a.dataset.reset];await save(own);});}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- canvas ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d");
function setImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>{const same=S.img&&S.img.width==i.width;S.img=i;if(!same)fit();draw();res();};i.src=src;});}
function fit(){if(!S.img)return;const r=cv.getBoundingClientRect();const s=Math.min(r.width/S.img.width,r.height/S.img.height)*.97;S.view={s,x:(r.width-S.img.width*s)/2,y:(r.height-S.img.height*s)/2};}
function focus(c){const r=cv.getBoundingClientRect();const s=Math.max(S.view.s,Math.min(r.width,r.height)/S.img.width*4);S.view={s,x:r.width/2-c.cx*s,y:r.height/2-c.cy*s};draw();}
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;fit();draw();}
window.onresize=resize;
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);if(!S.img||!S.data)return;
  const v=S.view,dp=devicePixelRatio;ctx.setTransform(v.s*dp,0,0,v.s*dp,v.x*dp,v.y*dp);ctx.drawImage(S.img,0,0);
  const res={};const showRes=S.result&&(S.step=="inspect"||S.step=="review");
  if(showRes)S.result.components.forEach(c=>res[c.ref]=c);
  const halo=(x,y,w,h,sel)=>{ // big, unmissable fault marker: glow + thick outline
    ctx.save();ctx.shadowColor=sel?"#c77dff":"#ff2020";ctx.shadowBlur=18;ctx.lineWidth=(sel?6:4)/v.s;ctx.strokeStyle=sel?"#c77dff":"#ff3030";
    ctx.strokeRect(x,y,w,h);ctx.restore();ctx.lineWidth=1.5/v.s;ctx.strokeStyle="#fff";ctx.strokeRect(x-3/v.s,y-3/v.s,w+6/v.s,h+6/v.s);};
  const label=(txt,x,y,sel)=>{const fs=Math.max(11,15/v.s);ctx.font=`800 ${fs}px system-ui`;const tw=ctx.measureText(txt).width;
    ctx.fillStyle=sel?"#c77dff":"#e0181b";ctx.fillRect(x,y-fs-6/v.s,tw+10/v.s,fs+6/v.s);ctx.fillStyle="#fff";ctx.fillText(txt,x+5/v.s,y-5/v.s);};
  const fails=[];
  (S.data.overlay||[]).forEach(o=>{
    const r=res[o.ref];
    if(showRes&&r&&!r.ok){fails.push([o,r]);return;}
    if(showRes&&(!o.enabled||o.fiducial))return;           // results view: only what matters
    let col=o.fiducial?"#ffb020":!o.enabled?"#666":"#3aa0ff";
    if(r)col="#2ecc71";if(o.ref==S.sel)col="#c77dff";
    ctx.save();ctx.translate(o.cx,o.cy);ctx.rotate(o.angle*Math.PI/180);const k=o.ppm;
    ctx.globalAlpha=showRes?.45:1;ctx.lineWidth=Math.max(1,1.5/v.s);ctx.strokeStyle=col;
    if(o.fiducial){ctx.beginPath();ctx.arc(0,0,k*.9,0,7);ctx.stroke();}
    else{ctx.strokeRect(-o.body[0]/2*k,-o.body[1]/2*k,o.body[0]*k,o.body[1]*k);
      if(!showRes){ctx.globalAlpha=.6;o.pads.forEach(([x,y,l,w])=>ctx.strokeRect((x-l/2)*k,(-y-w/2)*k,l*k,w*k));}}
    ctx.restore();
    if(!showRes&&(v.s>0.6||o.ref==S.sel||o.fiducial)){ctx.font=`bold ${Math.max(10,13/v.s)}px system-ui`;ctx.fillStyle=col;
      ctx.fillText(o.ref,o.cx+o.body[0]*o.ppm/2+3/v.s,o.cy-o.body[1]*o.ppm/2);}
  });
  // dim the board a little so red faults pop, then draw faults on top
  if(showRes&&(fails.length||S.result.components.some(c=>c.box&&!c.ok))){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#0006";ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();
}
  fails.forEach(([o,r])=>{const k=o.ppm,m=1.2*k,sel=o.ref==S.sel;
    const hx=Math.max(o.body[0]/2,...o.pads.map(p=>Math.abs(p[0])+p[2]/2))*k+m,hy=Math.max(o.body[1]/2,...o.pads.map(p=>Math.abs(p[1])+p[3]/2))*k+m;
    const R=Math.max(hx,hy);
    ctx.save();ctx.beginPath();ctx.rect(o.cx-R,o.cy-R,2*R,2*R);ctx.clip();ctx.drawImage(S.img,0,0);ctx.restore(); // undimmed window on the fault
    halo(o.cx-R,o.cy-R,2*R,2*R,sel);label(`${o.ref} ${r.fails.join("/")}`,o.cx-R,o.cy-R-4/v.s,sel);});
  if(showRes)S.result.components.filter(c=>c.box&&!c.ok).forEach(c=>{const[x,y,w,h]=c.box;const sel=c.ref==S.sel;
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(S.img,0,0);ctx.restore();
    halo(x,y,w,h,sel);label(c.ref.split(" ")[0]+" FOREIGN OBJECT?",x,y-4/v.s,sel);});
  S.teach.forEach(t=>{ctx.strokeStyle="#ffb020";ctx.lineWidth=3/v.s;ctx.beginPath();ctx.arc(t.px,t.py,12/v.s,0,7);ctx.moveTo(t.px-20/v.s,t.py);ctx.lineTo(t.px+20/v.s,t.py);ctx.moveTo(t.px,t.py-20/v.s);ctx.lineTo(t.px,t.py+20/v.s);ctx.stroke();});
}
function toImg(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-S.view.x)/S.view.s,(e.clientY-r.top-S.view.y)/S.view.s];}
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY<0?1.2:1/1.2;
  S.view.x=mx-(mx-S.view.x)*f;S.view.y=my-(my-S.view.y)*f;S.view.s*=f;draw();};
let drag=null;
cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,vx:S.view.x,vy:S.view.y,moved:false};};
window.onmousemove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){S.view.x=drag.vx+dx;S.view.y=drag.vy+dy;draw();}};
window.onmouseup=async e=>{const d=drag;drag=null;if(!d||d.moved||e.target!==cv||!S.data)return;const[x,y]=toImg(e);
  if(S.step=="align"&&S.teachRef){S.teach.push({ref:S.teachRef,px:x,py:y});S.teachRef=null;draw();
    if(S.teach.length>=2){await api(P()+"/teach",{json:{points:S.teach}});toast("✔ Aligned");S.teach=[];await refresh();draw();}side();return;}
  if(S.step=="rois"&&S.teachMode){const r=await api(P()+"/parts",{json:{px:x,py:y,ref:S.teachRef2||undefined}});S.teachRef2=null;S.sel=null;await refresh();side();draw();toast("➕ "+r.ref+" added — next: "+(S.data.next_ref||"done"));return;
    S.sel=r.ref;await refresh();side();draw();toast("➕ "+r.ref+" added — adjust size/position if needed");return;}
  let best=null,bd=1e9;(S.data.overlay||[]).forEach(o=>{const dd=Math.hypot(o.cx-x,o.cy-y);if(dd<bd){bd=dd;best=o;}});
  if(best&&bd<Math.max(best.body[0],best.body[1])*best.ppm+20/S.view.s){
    if(S.step=="review"&&S.result){const f=S.result.components.filter(c=>!c.ok);const i=f.findIndex(c=>c.ref==best.ref);if(i>=0){S.revIdx=i;side();draw();return;}}
    S.sel=best.ref;if(S.step!="rois")go("rois");else{side();draw();}}};
cv.ondblclick=()=>{fit();draw();};
document.addEventListener("keydown",e=>{if(S.step=="review"&&S.result){if(e.key=="d")$("#bDef")?.click();if(e.key=="f")document.querySelector("[data-fc=other]")?.click();}
  if(e.key==" "&&S.step=="inspect"){e.preventDefault();$("#bIn")?.click();}});
resize();loadPrograms().then(()=>{renderSteps();side();});
</script>
</body>
</html>
