<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCBA AOI</title>
<style>
:root{--bg:#0d1014;--panel:#13171c;--panel2:#1a1f26;--panel3:#222933;--line:#262d37;--line2:#323b47;--txt:#dfe4ea;--dim:#8792a0;
--ok:#3fb950;--ok-d:#10261a;--bad:#f0524d;--bad-d:#2d1414;--warn:#d6a232;--acc:#3d8bfd;--acc-d:#14233a;--sel:#a371f7;
--r:4px;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;font-weight:500;color:inherit;cursor:pointer;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel2);padding:6px 11px;transition:background .1s,border-color .1s}
button:hover{background:var(--panel3);border-color:#3f4a58}
button:disabled{opacity:.4;cursor:default}
button.big{font-size:13px;font-weight:600;padding:8px 12px;width:100%;margin:4px 0;display:flex;align-items:center;gap:8px;justify-content:center}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:#2f7ae8}
button.ok{background:#238636;border-color:#2ea043;color:#fff}button.ok:hover{background:#2a9a40}
button.bad{background:#b62324;border-color:#da3633;color:#fff}button.bad:hover{background:#c92a2a}
button.on{border-color:var(--acc);background:var(--acc-d);color:#cfe0ff}
header{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);height:44px}
header h1{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin:0 10px 0 0;white-space:nowrap;color:#fff}
header>button{padding:5px 10px;font-size:12px;background:transparent;border-color:transparent;color:var(--dim)}header>button:hover{background:var(--panel2);border-color:var(--line2);color:var(--txt)}
select,input{font:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:var(--r);padding:5px 8px}
select:focus,input:focus{outline:none;border-color:var(--acc)}
header select{min-width:180px;font-weight:600}
.steps{display:flex;gap:0;flex:1;overflow-x:auto;align-items:stretch;height:100%;margin-left:6px}
.step{display:flex;align-items:center;gap:7px;padding:0 12px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;font-size:12.5px;font-weight:500;color:var(--dim);white-space:nowrap}
.step:hover{background:transparent;color:var(--txt)}
.step .n{border:1px solid var(--line2);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--dim)}
.step.done{color:var(--txt)}.step.done .n{background:#1f3a28;border-color:#2ea043;color:#7ee2a0}
.step.cur{color:#fff;border-bottom-color:var(--acc)}.step.cur .n{background:var(--acc);border-color:var(--acc);color:#fff}
.arrow{display:none}
main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;background:#080a0d;min-width:0}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#side{width:370px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;overflow-y:auto}
#side h2{margin:0 0 12px;font-size:14px;font-weight:650;letter-spacing:.2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#side h3{margin:14px 0 6px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.9px;color:var(--dim)}
#side b[style*="display:block"]{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:650;margin-top:14px!important}
.hint{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:8px 10px;border-radius:var(--r);font-size:12.5px;margin:8px 0;color:#c9d3df}
.hint.big{font-size:13px;font-weight:600}
.banner{font-size:22px;font-weight:700;letter-spacing:3px;text-align:center;border-radius:var(--r);padding:10px;margin:8px 0}
.banner.pass{background:var(--ok-d);color:#56d364;border:1px solid #2ea043}.banner.fail{background:var(--bad-d);color:#ff7b72;border:1px solid #da3633}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;text-align:left}
.tile b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.tile span{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row>*{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,38px);gap:4px;justify-content:center;margin:8px 0}
.pad button{height:34px;font-size:13px;padding:0}
.card{background:var(--panel2);border-radius:var(--r);padding:10px;margin:8px 0;border:1px solid var(--line)}
.card.cur{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.card .imgs{display:flex;gap:6px;align-items:center}.card .imgs>div{flex:1;min-width:0;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}.card .imgs img{width:100%}
.card img{flex:1;min-width:0;border-radius:3px;background:#000;max-height:200px;object-fit:contain;margin-top:3px}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.5px;background:var(--bad);color:#fff;margin:2px;vertical-align:middle}
.tag.w{background:var(--warn);color:#1f1300}
.bar{height:18px;background:#6e2525;border-radius:3px;margin:3px 0;display:flex;align-items:center;padding:0 8px;font-size:12px;white-space:nowrap}
.chk{display:flex;gap:5px;flex-wrap:wrap}.chk button{flex:1 1 45%;font-size:12px}
label.sl{display:block;margin:10px 0 2px;color:var(--dim);font-size:12px}input[type=range]{width:100%;accent-color:var(--acc)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b0e12f2;border:1px solid var(--line2);padding:8px 14px;border-radius:var(--r);font-size:12.5px;display:none;z-index:99;box-shadow:0 6px 24px #0008}
.legend{position:absolute;left:10px;bottom:10px;background:#0b0e12d9;border:1px solid var(--line);padding:4px 10px;border-radius:var(--r);font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:1px;margin:0 4px 0 8px;vertical-align:middle}
details summary{font-size:12px !important;color:var(--dim)}
table td{padding:4px 5px}
a.big{font-size:13px !important;padding:8px 12px !important;border:1px solid var(--line2);font-weight:600 !important}
@media (max-width:800px){main{flex-direction:column}#side{width:auto;max-width:none;height:50vh}}
</style>
</head>
<body>
<header>
  <h1>PCBA&nbsp;AOI <small id="ver" style="font-weight:400;color:var(--dim);font-size:11px"></small></h1>
  <select id="prog" title="Program"></select>
  <nav class="steps" id="steps"></nav>
  <button id="bList" title="Parts list">Parts</button>
  <button id="bLib" title="Package library">Library</button>
  <button id="bStats" title="Statistics">Statistics</button>
  <button id="bSet" title="Settings">Settings</button>
</header>
<main>
  <div id="view"><canvas id="cv"></canvas>
    <div class="legend"><i style="background:var(--ok)"></i>Pass<i style="background:var(--bad)"></i>Fail<i style="background:var(--acc)"></i>ROI<i style="background:var(--warn)"></i>Fiducial<i style="background:#666"></i>Off</div>
  </div>
  <aside id="side"></aside>
</main>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>
<script>
const $=s=>document.querySelector(s);
const STEPS=[["program","","Program"],["board","","Board"],["align","","Align"],["rois","","Fine-tune"],["inspect","","Inspect"],["review","","Review"]];
let S={prog:null,data:null,step:"program",img:null,imgSrc:null,view:{s:1,x:0,y:0},sel:null,teach:[],result:null,revIdx:0,watch:null};

async function api(path,opt={}){
  if(opt.json){opt.body=JSON.stringify(opt.json);opt.headers={"Content-Type":"application/json"};opt.method=opt.method||"POST";}
  const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok){toast("Error: "+(j.error||r.status));throw new Error(j.error);}return j;
}
function toast(t,ms=2500){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",ms);}
function pickFile(accept){return new Promise(res=>{const f=$("#fileIn");f.accept=accept;f.value="";f.onchange=()=>res(f.files[0]);f.click();});}
const P=()=>"/api/programs/"+encodeURIComponent(S.prog);

/* ---------- programs ---------- */
async function loadPrograms(sel){
  const list=await api("/api/programs");const s=$("#prog");
  s.innerHTML='<option value="">— choose program —</option>'+list.map(n=>`<option>${n}</option>`).join("")+'<option value="__new">＋ New program…</option>';
  if(sel){s.value=sel;await openProgram(sel);}
}
$("#prog").onchange=async e=>{
  if(e.target.value==="__new"){const n=prompt("Program name (e.g. PCBA-1234 revB)");if(n){await api("/api/programs",{json:{name:n}});await loadPrograms(n.replace(/[^A-Za-z0-9_.-]+/g,"_"));go("program");}else e.target.value=S.prog||"";return;}
  await openProgram(e.target.value);
};
async function openProgram(n){
  S.prog=n||null;S.result=null;S.sel=null;
  if(!n){S.data=null;renderSteps();side();draw();return;}
  await refresh();
  const d=S.data;go(!d.components.length?"program":!d.has_golden?"board":!d.transform?"align":"inspect");
}
async function refresh(){S.data=await api(P());if(S.data.has_golden&&!S.result)await setImg(P()+"/golden.jpg?"+Date.now());renderSteps();}

/* ---------- step bar ---------- */
function stepDone(k){const d=S.data;if(!d)return false;
  return {program:d.components.length>0,board:d.has_golden,align:!!d.transform,rois:!!d.transform,inspect:!!S.result,review:false}[k];}
function renderSteps(){
  $("#steps").innerHTML=STEPS.map(([k,i,t],n)=>(n?'<span class="arrow">→</span>':"")+`<button class="step ${stepDone(k)?"done":""} ${S.step==k?"cur":""}" data-k="${k}"><span class="n">${stepDone(k)?"✓":n+1}</span>${i} ${t}</button>`).join("");
  document.querySelectorAll(".step").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(k){S.step=k;if(k!=="align")S.teach=[];renderSteps();side();draw();}
$("#bStats").onclick=()=>go("stats");$("#bLib").onclick=()=>{S.libPkg=null;go("library");};$("#bList").onclick=()=>go("list");$("#bSet").onclick=()=>go("settings");

/* ---------- side panels ---------- */
function side(){
  const el=$("#side"),d=S.data;
  if(!S.prog&&S.step!=="settings"){el.innerHTML=`<h2>Start</h2>
    <div class="hint big">↑ Pick a program at the top — or make a new one</div>
    <button class="big pri" id="bNew">New program</button>
    <button class="big" id="bDemo">Try the demo board</button>`;
    $("#bNew").onclick=()=>{$("#prog").value="__new";$("#prog").onchange({target:$("#prog")});};
    $("#bDemo").onclick=demo;return;}
  (PANELS[S.step]||(()=>{}))(el,d);
}
function verifyHtml(v){return `<div class="card" style="border-color:${v.ok?"var(--ok)":"var(--bad)"};font-size:12px">
  <b style="color:${v.ok?"var(--ok)":"var(--bad)"}">${v.ok?"✓ Fiducials verified":"✕ Fiducials NOT verified"}</b> on ${v.source}
  ${v.registration?` · ${esc(v.registration.method||"")} · match ${v.registration.match??"—"} · residual ${v.registration.fid_residual_px??"—"} px${v.registration.msg?"<br>"+esc(v.registration.msg):""}`:""}
  <table style="width:100%">${v.fids.map(f=>`<tr><td><b>${esc(f.ref||"")}</b></td><td>${f.found?"✓":"✕"}</td><td>${f.score!=null?"score "+Math.round(f.score*100)+"%":esc(f.why||"")}</td><td>${f.match!=null?"match "+f.match:""}</td><td>${f.r?"r "+f.r+"px":""}</td></tr>`).join("")}</table></div>`;}
function fidTeach(ref,px,py){
  const m=document.createElement("div");m.style.cssText="position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center";
  let st={px,py,view:"binary",par:null,res:null,busy:false,again:false};
  const sl=(id,lab,min,max,step)=>`<div class="row" style="margin:3px 0"><span style="flex:0 0 130px">${lab}: <b id="${id}v"></b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"></div>`;
  m.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(900px,96vw);max-height:94vh;overflow:auto">
   <h2>Teach fiducial ${esc(ref)}</h2>
   <div style="display:flex;gap:14px;flex-wrap:wrap">
    <div style="flex:1 1 380px;min-width:300px">
     <div class="row"><span style="flex:0">View</span><select id="ftV"><option value="binary">Binary (what it thresholds)</option><option value="image">Image</option></select></div>
     <img id="ftI" style="width:100%;image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;cursor:crosshair;background:#000">
     <div id="ftS" style="text-align:center;font-weight:800;margin-top:6px"></div>
     <div style="font-size:11px;color:var(--dim);text-align:center">Click in the view to re-centre on the mark · blue ring = search area</div>
    </div>
    <div style="flex:1 1 300px">
     <button class="big pri" id="ftSug">Suggest settings from this mark</button>
     <div class="row"><span style="flex:0 0 130px">Look at</span><select id="ftC"><option value="auto">Auto (best)</option><option value="gray">Brightness</option><option value="copper">Copper colour (dull pads on green)</option></select></div>
     <label style="display:flex;gap:6px;margin:4px 0"><input type="checkbox" id="ftA"> Auto threshold (Otsu)</label>
     <label style="display:flex;gap:6px;margin:4px 0"><input type="checkbox" id="ftD"> Mark is darker than surround (invert)</label>
     ${sl("ftT","Threshold",0,255,1)}${sl("ftB","Blur",1,15,2)}${sl("ftR0","Min radius px",1,80,0.5)}${sl("ftR1","Max radius px",2,120,0.5)}
     ${sl("ftQ","Roundness ×100",20,95,1)}${sl("ftSr","Search ± mm",0.5,15,0.5)}${sl("ftM","Template match ≥",0,0.95,0.05)}
     <div id="ftInfo" style="font-size:12px;color:var(--dim);margin-top:6px"></div>
    </div></div>
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button id="ftOK" class="pri" style="flex:0 0 120px">OK</button><button id="ftX" style="flex:0 0 120px">Cancel</button></div></div>`;
  document.body.appendChild(m);const q=x=>m.querySelector(x);const U=P()+"/fiducials/"+encodeURIComponent(ref);
  const read=()=>({polarity:q("#ftD").checked?"dark":(st.par&&st.par.polarity=="auto"?"auto":"bright"),threshold:q("#ftA").checked?null:+q("#ftT").value,blur:+q("#ftB").value,
    rmin_px:+q("#ftR0").value,rmax_px:+q("#ftR1").value,roundness:+q("#ftQ").value/100,search_mm:+q("#ftSr").value,min_match:+q("#ftM").value,channel:q("#ftC").value});
  const fill=p=>{st.par=p;q("#ftA").checked=p.threshold==null;q("#ftD").checked=p.polarity=="dark";q("#ftT").value=p.threshold??(st.res?st.res.otsu:128);q("#ftT").disabled=p.threshold==null;
    q("#ftB").value=p.blur;q("#ftR0").value=p.rmin_px??Math.max(1,(st.res?st.res.expected_r_px:8)*.6);q("#ftR1").value=p.rmax_px??(st.res?st.res.expected_r_px:8)*1.5;
    q("#ftQ").value=Math.round(p.roundness*100);q("#ftSr").value=p.search_mm;q("#ftM").value=p.min_match;q("#ftC").value=p.channel||"auto";lab();};
  const lab=()=>["ftT","ftB","ftR0","ftR1","ftQ","ftSr","ftM"].forEach(i=>q("#"+i+"v").textContent=q("#"+i).value);
  const run=async(params)=>{if(st.busy){st.again=true;return;}st.busy=true;
    try{const r=await api(U+"/try",{json:{px:st.px,py:st.py,params}});st.res=r;if(!params)fill(r.params);
      q("#ftI").src=r.views[st.view];const h=r.hit;
      q("#ftS").innerHTML=r.found?`<span style="color:var(--ok)">FOUND ✓ (${h.px.toFixed(1)}, ${h.py.toFixed(1)}) r=${h.r}px · score ${Math.round(h.score*100)}%${h.match!=null?" · match "+h.match:""}</span>`:
        h?`<span style="color:var(--warn)">WEAK ${Math.round(h.score*100)}% — adjust settings</span>`:`<span style="color:var(--bad)">NOT FOUND ✕</span>`;
      q("#ftInfo").textContent=`Expected radius ≈ ${r.expected_r_px}px (from .gen size) · Otsu ≈ ${r.otsu}${h?` · roundness ${h.roundness} · ${h.polarity} mark · ${h.channel=="copper"?"copper colour":"brightness"}`:""}${r.template?" · checked against taught template":""}`;
      q("#ftOK").disabled=!r.found;}
    finally{st.busy=false;if(st.again){st.again=false;run(read());}}};
  let tm;const live=()=>{lab();q("#ftT").disabled=q("#ftA").checked;clearTimeout(tm);tm=setTimeout(()=>run(read()),120);};
  m.querySelectorAll("input").forEach(i=>i.oninput=live);q("#ftC").onchange=live;
  q("#ftV").onchange=e=>{st.view=e.target.value;if(st.res)q("#ftI").src=st.res.views[st.view];};
  q("#ftI").onclick=e=>{const b=e.target.getBoundingClientRect(),R=Math.max(st.res.params.search_mm*(S.data.overlay[0]?.ppm||10),st.res.expected_r_px*3,20);
    const k=(e.clientX-b.left)/b.width,l=(e.clientY-b.top)/b.height;st.px=st.px-R+k*2*R;st.py=st.py-R+l*2*R;run(read());};
  q("#ftSug").onclick=async()=>{const h=st.res&&st.res.hit;const s=await api(U+"/suggest",{json:{px:h?h.px:st.px,py:h?h.py:st.py}});
    fill({...read(),...s,threshold:null});q("#ftInfo").textContent=`Measured mark: radius ${s.measured.r_px}px · ${s.measured.polarity} on its surround (${s.channel=="copper"?"copper colour":"brightness"}) · Otsu ≈ ${s.measured.threshold}. Radius window set to ${s.rmin_px}–${s.rmax_px}px.`;run(read());};
  q("#ftX").onclick=()=>m.remove();
  q("#ftOK").onclick=async()=>{const h=st.res.hit;const r=await api(U+"/teach",{json:{px:h.px,py:h.py,params:read()}});m.remove();
    toast(r.fit?`✓ ${ref} taught · max error ${r.fit.max_mm} mm`:`✓ ${ref} taught — teach one more`,3500);
    const next=S.data.components.filter(c=>c.fiducial).map(c=>c.ref).find(f=>f!=ref&&!(S.data.fid_teach||{})[f]);await refresh();side();draw();
    if(next&&!r.fit){S.fidPick=next;side();}};
  run(null);}
function libConflict(cf,c){const m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center";
  const f=o=>Object.entries(o).filter(([k])=>!["th","checks"].includes(k)).map(([k,v])=>`${k}: ${Array.isArray(v)?(Array.isArray(v[0])?v.length+" pads":v.map(x=>+(+x).toFixed(2)).join(", ")):v}`).join("<br>");
  m.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(520px,94vw)">
   <h2>Library already has ${esc(cf.name)}</h2><div style="color:var(--dim);font-size:12px">saved from ${esc(cf.from||"?")} ${cf.updated?new Date(cf.updated*1000).toLocaleString():""} — and it's different</div>
   <div style="display:flex;gap:8px;font-size:12px;margin:8px 0"><div style="flex:1" class="card"><b>Library</b><br>${f(cf.library)}</div><div style="flex:1" class="card"><b>This program</b><br>${f(cf.program)}</div></div>
   <button class="big pri" data-a="overwrite">Overwrite library with mine (old copy kept in history)</button>
   ${cf.scope=="package"?`<button class="big" data-a="variant">Save as a new package variant…</button>`:""}
   ${cf.scope=="package"&&c.ipn?`<button class="big" data-a="ipn">Keep library package — save mine for IPN ${esc(c.ipn)} only</button>`:""}
   <button class="big" data-a="use">Use the library version here</button><button data-a="x">Cancel</button></div>`;document.body.appendChild(m);
  const U=P()+"/component/"+encodeURIComponent(c.ref)+"/library";
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
    if(a=="overwrite")await api(U,{json:{scope:cf.scope,mode:"overwrite"}});
    if(a=="variant"){const n=prompt("New package name",cf.name+"_"+(c.ipn||c.ref));if(!n)return;await api(U,{json:{scope:"package",mode:"variant",new_name:n}});}
    if(a=="ipn"){await api(P()+"/component/"+encodeURIComponent(c.ref)+"/promote_ipn",{method:"POST"});}
    if(a=="use")await api(U,{json:{scope:cf.scope,mode:"use_library"}});
    m.remove();if(a!="x"){toast("✓ Done");await refresh();side();draw();}});}
function pickBoard(boards,cb){const m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center";
  m.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(460px,92vw);max-height:80vh;overflow:auto">
   <h2>Which board?</h2><input id="pbq" placeholder="filter…" style="width:100%;margin-bottom:6px">

const TUNE=[["presence","Missing part (higher = stricter)",.2,.95,.01],["min_on_pad","On pad min (taught parts)",.2,.95,.05],
  ["offset_mm","Max offset mm",.05,1.5,.05],["polarity_margin","Polarity margin (lower = stricter)",0,.4,.01],
  ["ocv","Marking match",.05,.9,.01],["bridge","Solder bridge (lower = stricter)",.3,3,.1],["search_mm","Search range mm",.1,2,.1]];
const CHECKS=[["presence","Missing"],["polarity","Polarity"],["ocv","Marking"],["offset","↔ Offset"],["bridge","Bridge"]];
function tuneBox(base,own,idp){ // base = inherited values, own = this level's overrides
  return TUNE.map(([k,t,a,b,st])=>{const v=own[k]??base[k]??0.5;const set=own[k]!=null;
    return `<label class="sl">${t}: <b id="${idp}v_${k}">${(+v).toFixed(2)}</b> ${set?`<a data-reset="${k}" style="color:var(--warn);cursor:pointer">↺ inherited</a>`:`<span style="color:var(--dim)">(inherited)</span>`}</label>
    <input type="range" data-tk="${k}" min="${a}" max="${b}" step="${st}" value="${v}">`}).join("");}
function wireTune(el,own,save,idp){
  el.querySelectorAll("[data-tk]").forEach(r=>{r.oninput=()=>{$("#"+idp+"v_"+r.dataset.tk).textContent=(+r.value).toFixed(2)};
    r.onchange=async()=>{own[r.dataset.tk]=+r.value;await save(own);toast("✓ Saved");}});
  el.querySelectorAll("[data-reset]").forEach(a=>a.onclick=async()=>{delete own[a.dataset.reset];await save(own);});}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- canvas ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d");
function setImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>{const same=S.img&&S.img.width==i.width;S.img=i;if(!same)fit();draw();res();};i.src=src;});}
function fit(){if(!S.img)return;const r=cv.getBoundingClientRect();const s=Math.min(r.width/S.img.width,r.height/S.img.height)*.97;S.view={s,x:(r.width-S.img.width*s)/2,y:(r.height-S.img.height*s)/2};}
function focus(c){const r=cv.getBoundingClientRect();const s=Math.max(S.view.s,Math.min(r.width,r.height)/S.img.width*4);S.view={s,x:r.width/2-c.cx*s,y:r.height/2-c.cy*s};draw();}
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;fit();draw();}
window.onresize=resize;
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);if(!S.img||!S.data)return;
  const v=S.view,dp=devicePixelRatio;ctx.setTransform(v.s*dp,0,0,v.s*dp,v.x*dp,v.y*dp);ctx.drawImage(S.img,0,0);
  const res={};const showRes=S.result&&(S.step=="inspect"||S.step=="review");
  if(showRes)S.result.components.forEach(c=>res[c.ref]=c);
  const halo=(x,y,w,h,sel)=>{ // big, unmissable fault marker: glow + thick outline
    ctx.save();ctx.shadowColor=sel?"#c77dff":"#ff2020";ctx.shadowBlur=18;ctx.lineWidth=(sel?6:4)/v.s;ctx.strokeStyle=sel?"#c77dff":"#ff3030";
    ctx.strokeRect(x,y,w,h);ctx.restore();ctx.lineWidth=1.5/v.s;ctx.strokeStyle="#fff";ctx.strokeRect(x-3/v.s,y-3/v.s,w+6/v.s,h+6/v.s);};
  const label=(txt,x,y,sel)=>{const fs=Math.max(11,15/v.s);ctx.font=`800 ${fs}px system-ui`;const tw=ctx.measureText(txt).width;
    ctx.fillStyle=sel?"#c77dff":"#e0181b";ctx.fillRect(x,y-fs-6/v.s,tw+10/v.s,fs+6/v.s);ctx.fillStyle="#fff";ctx.fillText(txt,x+5/v.s,y-5/v.s);};
  const fails=[];
  const lo=S.layDrag||{x:0,y:0};ctx.save();ctx.translate(lo.x,lo.y);
  (S.data.overlay||[]).forEach(o=>{
    const r=res[o.ref];
    if(showRes&&r&&!r.ok){fails.push([o,r]);return;}
    if(showRes&&(!o.enabled||o.fiducial))return;           // results view: only what matters
    let col=o.fiducial?"#ffb020":!o.enabled?"#666":"#3aa0ff";
    if(r)col="#2ecc71";if(o.ref==S.sel||(S.step=="rois"&&S.hlPkg&&o.package==S.hlPkg))col="#c77dff";
    ctx.save();ctx.translate(o.cx,o.cy);ctx.rotate(o.angle*Math.PI/180);const k=o.ppm;
    ctx.globalAlpha=showRes?.45:1;ctx.lineWidth=Math.max(1,1.5/v.s);ctx.strokeStyle=col;
    if(o.fiducial){ctx.beginPath();ctx.arc(0,0,k*.9,0,7);ctx.stroke();}
    else{ctx.strokeRect(-o.body[0]/2*k,-o.body[1]/2*k,o.body[0]*k,o.body[1]*k);
      if(!showRes){ctx.globalAlpha=.6;o.pads.forEach(([x,y,l,w])=>ctx.strokeRect((x-l/2)*k,(-y-w/2)*k,l*k,w*k));
        if(S.step=="rois"&&(o.ref==S.sel||(S.hlPkg&&o.package==S.hlPkg&&!S.sel))){ctx.globalAlpha=1;ctx.setLineDash([4/v.s,3/v.s]);
          [[o.ocv_roi,"#22d3ee"],[o.pol_roi,"#ff4fd8"]].forEach(([r,cl])=>{if(!r)return;ctx.strokeStyle=cl;ctx.strokeRect((r[0]-r[2]/2)*k,(-r[1]-r[3]/2)*k,r[2]*k,r[3]*k);});ctx.setLineDash([]);}}}
    ctx.restore();
    if(!showRes&&(v.s>0.6||o.ref==S.sel||o.fiducial)){ctx.font=`bold ${Math.max(10,13/v.s)}px system-ui`;ctx.fillStyle=col;
      ctx.fillText(o.ref,o.cx+o.body[0]*o.ppm/2+3/v.s,o.cy-o.body[1]*o.ppm/2);}
  });
  if(!showRes&&S.data.origin_px){const[o0,ox,oy]=S.data.origin_px;ctx.lineWidth=2.5/v.s;  // board origin (bottom-left) + axes
    [[ox,"#ff4d4d","X"],[oy,"#2ecc71","Y"]].forEach(([p,c,t])=>{ctx.strokeStyle=ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(o0[0],o0[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.font=`bold ${14/v.s}px system-ui`;ctx.fillText(t,p[0]+4/v.s,p[1]);});
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(o0[0],o0[1],4/v.s,0,7);ctx.fill();ctx.fillText("0,0",o0[0]+6/v.s,o0[1]+16/v.s);}
  ctx.restore();
  if(S.step=="align"&&S.data.fid_marks)Object.entries(S.data.fid_marks).forEach(([ref,m])=>{const man=m.source=="manual",R=Math.max(m.r||8,8/v.s);
    ctx.strokeStyle=man?"#ffb020":"#2ecc71";ctx.lineWidth=(ref==S.fidSel?3:2)/v.s;ctx.beginPath();ctx.arc(m.px,m.py,R,0,7);
    ctx.moveTo(m.px-R*1.8,m.py);ctx.lineTo(m.px+R*1.8,m.py);ctx.moveTo(m.px,m.py-R*1.8);ctx.lineTo(m.px,m.py+R*1.8);ctx.stroke();
    ctx.font=`bold ${13/v.s}px system-ui`;ctx.fillStyle=ctx.strokeStyle;ctx.fillText(ref+(m.score!=null?" "+Math.round(m.score*100)+"%":""),m.px+R*1.9,m.py-R);});
  // dim the board a little so red faults pop, then draw faults on top
  if(showRes&&(fails.length||S.result.components.some(c=>c.box&&!c.ok))){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#0006";ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();
}
  fails.forEach(([o,r])=>{const k=o.ppm,m=1.2*k,sel=o.ref==S.sel;
    const hx=Math.max(o.body[0]/2,...o.pads.map(p=>Math.abs(p[0])+p[2]/2))*k+m,hy=Math.max(o.body[1]/2,...o.pads.map(p=>Math.abs(p[1])+p[3]/2))*k+m;
    const R=Math.max(hx,hy);
    ctx.save();ctx.beginPath();ctx.rect(o.cx-R,o.cy-R,2*R,2*R);ctx.clip();ctx.drawImage(S.img,0,0);ctx.restore(); // undimmed window on the fault
    halo(o.cx-R,o.cy-R,2*R,2*R,sel);label(`${o.ref} ${r.fails.join("/")}`,o.cx-R,o.cy-R-4/v.s,sel);});
  if(showRes)S.result.components.filter(c=>c.box&&!c.ok).forEach(c=>{const[x,y,w,h]=c.box;const sel=c.ref==S.sel;
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(S.img,0,0);ctx.restore();
    halo(x,y,w,h,sel);label(c.ref.split(" ")[0]+" FOREIGN OBJECT?",x,y-4/v.s,sel);});
  S.teach.forEach(t=>{ctx.strokeStyle="#ffb020";ctx.lineWidth=3/v.s;ctx.beginPath();ctx.arc(t.px,t.py,12/v.s,0,7);ctx.moveTo(t.px-20/v.s,t.py);ctx.lineTo(t.px+20/v.s,t.py);ctx.moveTo(t.px,t.py-20/v.s);ctx.lineTo(t.px,t.py+20/v.s);ctx.stroke();});
}
function toImg(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-S.view.x)/S.view.s,(e.clientY-r.top-S.view.y)/S.view.s];}
cv.onwheel=e=>{e.preventDefault();
  if(layMode()){clearTimeout(S._wt);S._acc=S._acc||{r:0,s:0};if(e.shiftKey)S._acc.r+=(e.deltaY>0?1:-1)*S.step_deg;else S._acc.s+=(e.deltaY>0?-1:1)*0.005;
    S._wt=setTimeout(()=>{const a=S._acc;S._acc=null;S.adj({drot:a.r,dscale:a.s});},150);return;}const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY<0?1.2:1/1.2;
  S.view.x=mx-(mx-S.view.x)*f;S.view.y=my-(my-S.view.y)*f;S.view.s*=f;draw();};
let drag=null;
const layMode=()=>S.step=="align"&&S.dragLayout&&S.data&&S.data.transform;
const ppmNow=()=>(S.data.overlay&&S.data.overlay[0]&&S.data.overlay[0].ppm)||10;
// ---- click & drag editing of the selected part (Fine-tune)
function partXY(o,px,py){const a=-o.angle*Math.PI/180,dx=px-o.cx,dy=py-o.cy;   // image px -> part mm (x right, y up)
  return[(dx*Math.cos(a)-dy*Math.sin(a))/o.ppm,-(dx*Math.sin(a)+dy*Math.cos(a))/o.ppm];}
function geoHit(o,p){const tol=7/S.view.s/o.ppm,[x,y]=p,T=S.mvT||"whole";
  const inR=(r,m=0)=>Math.abs(x-r[0])<=r[2]/2+m&&Math.abs(y-r[1])<=r[3]/2+m;
  const corner=r=>Math.abs(Math.abs(x-r[0])-r[2]/2)<tol*1.5&&Math.abs(Math.abs(y-r[1])-r[3]/2)<tol*1.5;
  for(const[k,r]of[["pol",o.pol_roi],["ocv",o.ocv_roi]])if(r&&(T==k||T=="whole"||T=="body")){if(corner(r))return{kind:"grow",target:k,r};if(inR(r))return{kind:"move",target:k,r};}
  const bl=o.body[0]/2,bw=o.body[1]/2,ex=Math.abs(Math.abs(x)-bl)<tol&&Math.abs(y)<=bw+tol,ey=Math.abs(Math.abs(y)-bw)<tol&&Math.abs(x)<=bl+tol;
  if(ex||ey)return{kind:"size",ex,ey};
  const inBody=Math.abs(x)<=bl&&Math.abs(y)<=bw;
  const pi=o.pads.findIndex(q=>inR(q,tol*.5));if(pi>=0&&(!inBody||T=="body"))return{kind:"pad",pi,pad:o.pads[pi]};
  if(Math.abs(x)<=bl&&Math.abs(y)<=bw)return{kind:"move",target:T=="whole"?"whole":"body"};
  return null;}
const geoMode=()=>S.step=="rois"&&S.sel&&!S.teachMode&&S.data&&S.data.transform;
cv.onmousedown=e=>{let g=null;
  if(geoMode()){const o=(S.data.overlay||[]).find(o=>o.ref==S.sel);if(o){const[ix,iy]=toImg(e);const h=geoHit(o,partXY(o,ix,iy));
    if(h)g={...h,o,orig:JSON.parse(JSON.stringify(o)),p0:partXY(o,ix,iy),i0:[ix,iy],shift:e.shiftKey};}}
  drag={x:e.clientX,y:e.clientY,vx:S.view.x,vy:S.view.y,moved:false,lay:layMode(),geo:g};};
function geoPreview(g,ix,iy){const o=g.o,O=g.orig,p=partXY(O,ix,iy),dx=p[0]-g.p0[0],dy=p[1]-g.p0[1];
  if(g.kind=="move"&&(g.target=="whole"||g.target=="body")){const a=O.angle*Math.PI/180,k=O.ppm;
    o.cx=O.cx+(dx*Math.cos(a)+dy*Math.sin(a))*k;o.cy=O.cy+(dx*Math.sin(a)-dy*Math.cos(a))*k;
    if(g.target=="body")o.pads=O.pads.map(q=>[q[0]-dx,q[1]-dy,q[2],q[3]]);g.res={dx,dy};}
  else if(g.kind=="move"){const r=[...g.r];r[0]+=dx;r[1]+=dy;o[g.target+"_roi"]=r;g.res={dx,dy};}
  else if(g.kind=="grow"){const f=Math.max(.2,Math.hypot(p[0]-g.r[0],p[1]-g.r[1])/Math.max(1e-3,Math.hypot(g.p0[0]-g.r[0],g.p0[1]-g.r[1])));
    o[g.target+"_roi"]=[g.r[0],g.r[1],g.r[2]*f,g.r[3]*f];g.res={f};}
  else if(g.kind=="size"){const fl=g.ex?Math.max(.2,Math.abs(p[0])/Math.max(1e-3,Math.abs(g.p0[0]))):1,fw=g.ey?Math.max(.2,Math.abs(p[1])/Math.max(1e-3,Math.abs(g.p0[1]))):1;
    o.body=[O.body[0]*fl,O.body[1]*fw];g.res={fl,fw};}
  else if(g.kind=="pad"){const q=g.pad,horiz=Math.abs(q[0])>=Math.abs(q[1]);
    if(g.shift){const f=Math.max(.2,Math.hypot(p[0]-q[0],p[1]-q[1])/Math.max(1e-3,Math.hypot(g.p0[0]-q[0],g.p0[1]-q[1])));o.pads=O.pads.map(z=>[z[0],z[1],z[2]*f,z[3]*f]);g.res={mode:"size",f};}
    else{const f=Math.max(.2,horiz?Math.abs(p[0])/Math.max(1e-3,Math.abs(g.p0[0])):Math.abs(p[1])/Math.max(1e-3,Math.abs(g.p0[1])));o.pads=O.pads.map(z=>[z[0]*f,z[1]*f,z[2],z[3]]);g.res={mode:"span",f};}}
  draw();}
async function geoCommit(g){const r=g.res;if(!r||!S.geo)return;const c=S.data.components.find(c=>c.ref==S.sel);
  if(g.kind=="move"&&g.target=="whole"){const a=g.orig.angle*Math.PI/180,k=g.orig.ppm,sx=(r.dx*Math.cos(a)+r.dy*Math.sin(a)),sy=(r.dx*Math.sin(a)-r.dy*Math.cos(a));
    await api(P()+"/component/"+encodeURIComponent(S.sel),{method:"PUT",json:{nudge_mm:[sx,sy]}});await refresh();side();draw();return;}
  if(g.kind=="move")return S.geo({op:"move",target:g.target,dx:r.dx,dy:r.dy});
  if(g.kind=="grow")return S.geo({op:"grow",target:g.target,factor:r.f});
  if(g.kind=="size"){if(r.fl!=1)await S.geo({op:"body",key:"body_l",factor:r.fl});if(r.fw!=1)await S.geo({op:"body",key:"body_w",factor:r.fw});return;}
  if(g.kind=="pad")return S.geo({op:"pads",mode:r.mode,factor:r.f});}
window.onmousemove=e=>{
  if(!drag&&e.target===cv){let cur="";if(geoMode()){const o=(S.data.overlay||[]).find(o=>o.ref==S.sel);if(o){const[ix,iy]=toImg(e);const h=geoHit(o,partXY(o,ix,iy));
    if(h)cur=h.kind=="move"?"move":h.kind=="grow"?"nwse-resize":h.kind=="pad"?"ew-resize":h.ex&&h.ey?"nwse-resize":h.ex?"ew-resize":"ns-resize";}}cv.style.cursor=cur;}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  if(drag.moved&&drag.geo){const[ix,iy]=toImg(e);geoPreview(drag.geo,ix,iy);return;}
  if(!drag.moved&&!drag.geo&&geoMode()){}
  if(drag.moved){if(drag.lay)S.layDrag={x:dx/S.view.s,y:dy/S.view.s};else{S.view.x=drag.vx+dx;S.view.y=drag.vy+dy;}draw();}};
window.onmouseup=async e=>{const d=drag;drag=null;
  if(d&&d.geo&&d.moved){await geoCommit(d.geo);return;}
  if(d&&d.lay&&d.moved&&S.layDrag){const k=ppmNow(),o=S.layDrag;await S.adj({ddx:o.x/k,ddy:o.y/k});S.layDrag=null;draw();return;}
  if(!d||d.moved||e.target!==cv||!S.data)return;const[x,y]=toImg(e);
  if(S.step=="align"&&S.fidPick&&!e.altKey){const ref=S.fidPick;S.fidPick=null;S.fidSel=ref;side();fidTeach(ref,x,y);return;}
  if(S.step=="align"&&S.fidPick){const ref=S.fidPick;S.fidPick=null;S.fidSel=ref;const r=await api(P()+"/fiducials/mark",{json:{ref,px:x,py:y,snap:false}});
    const n=Object.keys(r.marks||{}).length;toast(r.fit?`✓ ${ref} set · max error ${r.fit.max_mm} mm`:`✓ ${ref} set — pick ${Math.max(0,2-n)} more`,3000);
    const next=S.data.components.filter(c=>c.fiducial).map(c=>c.ref).find(f=>!(r.marks||{})[f]);if(!r.fit&&next)S.fidPick=next;
    await refresh();side();draw();return;}
  if(S.step=="align"&&S.teachRef){S.teach.push({ref:S.teachRef,px:x,py:y});S.teachRef=null;draw();
    if(S.teach.length>=2){await api(P()+"/teach",{json:{points:S.teach}});toast("✓ Aligned");S.teach=[];await refresh();draw();}side();return;}
  if(S.step=="rois"&&S.teachMode){const r=await api(P()+"/parts",{json:{px:x,py:y,ref:S.teachRef2||undefined}});S.teachRef2=null;S.sel=null;await refresh();side();draw();toast(""+r.ref+" added — next: "+(S.data.next_ref||"done"));return;
    S.sel=r.ref;await refresh();side();draw();toast(""+r.ref+" added — adjust size/position if needed");return;}
  let best=null,bd=1e9;(S.data.overlay||[]).forEach(o=>{const dd=Math.hypot(o.cx-x,o.cy-y);if(dd<bd){bd=dd;best=o;}});
  if(best&&bd<Math.max(best.body[0],best.body[1])*best.ppm+20/S.view.s){
    if(S.step=="review"&&S.result){const f=S.result.components.filter(c=>!c.ok);const i=f.findIndex(c=>c.ref==best.ref);if(i>=0){S.revIdx=i;side();draw();return;}}
    S.sel=best.ref;S.hlPkg=best.package;if(S.step!="rois")go("rois");else{side();draw();}}};
cv.ondblclick=()=>{fit();draw();};
document.addEventListener("keydown",e=>{
  if((S.step=="align"||(S.step=="rois"&&!S.sel))&&S.data&&S.data.transform&&S.adj&&!/INPUT|SELECT/.test(document.activeElement.tagName)){
    const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];const k=e.shiftKey?5:1;
    if(m){e.preventDefault();S.adj({ddx:m[0]*S.step_mm*k,ddy:m[1]*S.step_mm*k});return;}
    if(e.key=="["||e.key=="]"){S.adj({drot:(e.key=="]"?1:-1)*S.step_deg*k});return;}}if(S.step=="review"&&S.result){if(e.key=="d")$("#bDef")?.click();if(e.key=="f")document.querySelector("[data-fc=other]")?.click();}
  if(e.key==" "&&S.step=="inspect"){e.preventDefault();$("#bIn")?.click();}});
fetch("/api/version").then(r=>r.json()).then(v=>$("#ver").textContent="v"+v.version).catch(()=>{});
resize();loadPrograms().then(()=>{renderSteps();side();});
</script>
